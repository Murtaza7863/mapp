name = "mapp-push"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_ID"

[vars]
VAPID_SUBJECT = "mailto:hello@example.com"
# Comma-separated allowed origins, or "*" for development only.
ALLOWED_ORIGINS = "https://your-app.pages.dev,http://localhost:5173"

# Set secrets via:
#   wrangler secret put VAPID_PUBLIC_KEY
#   wrangler secret put VAPID_PRIVATE_KEY
